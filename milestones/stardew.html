<title>矿井 120 层里程碑</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a farm-game mine read top to bottom - wooden sign, item hotbar of totals, a pixel cross-section of the shaft,
   then one parchment panel per mine zone with a row per elevator floor. One deliberate look (cave + parchment), no theme swap. */
:root {
  --cave: #1e140e;        /* page ground: cave rock */
  --cave-ink: #f3dcb0;    /* text on the cave */
  --cave-dim: #c4a072;
  --paper: #fbe5b4;       /* parchment panels */
  --paper-2: #f3d395;
  --ink: #3b210e;         /* text on parchment, all outlines */
  --ink-dim: #7a5432;
  --wood: #b7642a;
  --wood-lt: #dc8c48;
  --wood-dk: #7c3b14;
  --btn: #e9a24c;         /* elevator button */
  --early: #4f86b8;       /* dug down / early scripted dashes */
  --hand: #d4762a;        /* staircases placed by hand */
  --prog: #3d9a45;        /* the program dashed on its own */
  --earth: #9a6a3c;
  --ice: #5aa6cf;
  --lava: #d9472b;
  --gold: #f5c542;
  --f-pix: "Pixelify Sans", "ZCOOL QingKe HuangYou", "Microsoft YaHei", sans-serif;
  --f-display: "ZCOOL QingKe HuangYou", "Microsoft YaHei", "PingFang SC", sans-serif;
  --f-body: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--cave); color: var(--cave-ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  background-repeat: repeat; image-rendering: pixelated; }
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 36px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
img.px { image-rendering: pixelated; display: inline-block; vertical-align: middle; flex: none; }

/* wooden frame around parchment */
.frame { background: var(--paper);
  background-image: repeating-linear-gradient(0deg, rgba(122,84,50,.05) 0 2px, transparent 2px 6px);
  color: var(--ink); border: 6px solid var(--wood); border-top-color: var(--wood-lt); border-bottom-color: var(--wood-dk);
  outline: 3px solid var(--ink); box-shadow: inset 0 0 0 3px var(--wood-dk), 0 8px 0 rgba(0,0,0,.45); }
.frame.dark { background: #2a1a10; background-image: none; color: var(--cave-ink); }

/* sign */
.sign { padding: 26px 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 28px; align-items: center; }
.eyebrow { font-family: var(--f-pix); font-size: 13px; letter-spacing: .08em; color: var(--ink-dim); }
h1 { font-family: var(--f-pix); font-size: clamp(38px, 7vw, 64px); line-height: 1.05; color: var(--ink);
  text-shadow: 3px 3px 0 var(--paper-2); margin-top: 4px; }
.lede { margin: 12px 0 0; max-width: 58ch; color: var(--ink); }
.datebox { border: 4px solid var(--ink); background: var(--paper-2); padding: 10px 16px; text-align: center; min-width: 168px;
  box-shadow: inset 0 0 0 3px var(--btn); }
.datebox .d1 { font-family: var(--f-display); font-size: 22px; line-height: 1.2; }
.datebox .d2 { font-family: var(--f-pix); font-size: 15px; color: var(--ink-dim); }
.datebox .d3 { font-family: var(--f-pix); font-size: 13px; margin-top: 4px; color: var(--prog); font-weight: 600; }

/* hotbar of totals */
.hotbar { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; background: var(--wood);
  border: 4px solid var(--ink); box-shadow: inset 0 3px 0 var(--wood-lt), inset 0 -3px 0 var(--wood-dk), 0 8px 0 rgba(0,0,0,.45); }
.hot { flex: 1 1 170px; display: flex; align-items: center; gap: 12px; min-width: 0; }
.slot { width: 56px; height: 56px; flex: none; display: grid; place-items: center; background: #f2c98a;
  border: 3px solid var(--ink); box-shadow: inset 3px 3px 0 #c98f4e, inset -2px -2px 0 #ffe2b0; }
.hot b { display: block; font-family: var(--f-pix); font-weight: 600; font-size: 26px; line-height: 1.05; color: #fff4d8;
  text-shadow: 2px 2px 0 var(--ink); font-variant-numeric: tabular-nums; }
.hot span { font-size: 12.5px; color: #ffe8bf; line-height: 1.35; display: block; }

/* section titles on the cave */
.sec-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-title h2 { font-family: var(--f-pix); font-size: 28px; color: var(--cave-ink); text-shadow: 3px 3px 0 #000; }
.sec-title p { margin: 0; color: var(--cave-dim); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--cave-ink); margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sq { width: 12px; height: 12px; border: 2px solid #000; display: inline-block; }
.chart-box { overflow-x: auto; padding: 0; }
.chart-box svg { display: block; min-width: 720px; width: 100%; height: auto; }
.chart-note { font-size: 13px; color: var(--cave-dim); margin: 14px 0 0; max-width: 75ch; }

/* zone panels */
.zone-sign { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.plank { font-family: var(--f-display); font-size: 26px; line-height: 1; padding: 10px 18px 8px; color: #fff4d8;
  background: var(--zc); border: 3px solid #000; text-shadow: 2px 2px 0 rgba(0,0,0,.55);
  box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -3px 0 rgba(0,0,0,.25), 0 5px 0 rgba(0,0,0,.5); }
.plank small { font-family: var(--f-pix); font-size: 15px; margin-left: 10px; opacity: .9; }
.zone-sign p { margin: 0; color: var(--cave-dim); font-size: 14px; flex: 1 1 260px; }
.zone.earth { --zc: var(--earth); } .zone.ice { --zc: var(--ice); } .zone.lava { --zc: var(--lava); }
.strata { height: 18px; border: 3px solid var(--ink); border-bottom: 0; background-size: auto 100%; image-rendering: pixelated; }
.zone .frame { padding: 4px 22px; }

.ms { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 0 20px; padding: 18px 0; border-bottom: 2px dashed rgba(122,84,50,.35); }
.ms:last-child { border-bottom: 0; }
.ebtn { width: 70px; height: 54px; display: grid; place-items: center; background: var(--btn); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: inset 3px 3px 0 #ffd08a, inset -3px -3px 0 #b8702a;
  font-family: var(--f-pix); font-weight: 600; font-size: 26px; line-height: 1; }
.ms.goal { background: linear-gradient(90deg, rgba(245,197,66,.38), rgba(245,197,66,.08)); margin-inline: -22px; padding-inline: 22px; }
.ms.goal .ebtn { background: var(--gold); box-shadow: inset 3px 3px 0 #fff0a8, inset -3px -3px 0 #c8951e; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--ink-dim); }
.meta .game { font-family: var(--f-display); font-size: 19px; color: var(--ink); line-height: 1.2; }
.meta .pix { font-family: var(--f-pix); font-size: 14px; font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; line-height: 1.5; padding: 1px 8px; color: #fff; border: 2px solid var(--ink); white-space: nowrap; }
.chip.early { background: var(--early); } .chip.hand { background: var(--hand); } .chip.prog { background: var(--prog); }
.ribbon { font-family: var(--f-pix); font-weight: 600; font-size: 13px; padding: 1px 8px; background: var(--lava); color: #fff4d8;
  border: 2px solid var(--ink); }
ul.items { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; }
ul.items li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; min-width: 0; }
ul.items li img { margin-top: 3px; }
ul.items li span { min-width: 0; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; background: rgba(122,84,50,.15); padding: 0 3px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--cave-ink); }
.keys span { display: inline-flex; gap: 7px; align-items: center; }

.open { padding: 22px 26px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px 32px; }
.open h3 { font-family: var(--f-display); font-size: 20px; }
.open ul { margin: 8px 0 0; padding-left: 1.2em; }
.open li { margin-bottom: 5px; }
.src { font-size: 13px; color: var(--cave-dim); max-width: 80ch; margin: 0; }

@media (max-width: 600px) {
  .sign { grid-template-columns: 1fr; padding: 20px; }
  .zone .frame { padding: 4px 14px; }
  .ms { grid-template-columns: 1fr; gap: 10px; }
  .ms.goal { margin-inline: -14px; padding-inline: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .glow { animation: glow 1.6s steps(4) infinite alternate; }
  @keyframes glow { from { opacity: .35; } to { opacity: 1; } }
}
</style>
</head><body>

const ZK = [{k:"earth", lo:0, hi:39}, {k:"ice", lo:40, hi:79}, {k:"lava", lo:80, hi:120}];
const KIND_ICON = {fail:"skull", fix:"check", get:"chest", note:"note"};

/* ---------- pixel sprites (drawn here, 1 char = 1 pixel) ---------- */
const PAL = { k:"#3b210e", w:"#f4ecd8", g:"#62c046", c:"#c97a32", C:"#8f4a1c", y:"#f5c542", p:"#fbe9c0", r:"#d94a3a",
  l:"#dfe7ec", m:"#8796a4", h:"#a0602c" };
const SPR = {
  skull: ["..kkkkk..", ".kwwwwwk.", "kwwwwwwwk", "kwkkwkkwk", "kwkkwkkwk", "kwwwkwwwk", ".kwwwwwk.", "..kwkwk..", "..kkkkk.."],
  check: [".......kk", "......kgk", ".....kgk.", ".kk.kgk..", "kgkkgk...", ".kggk....", "..kgk....", "...k....."],
  chest: [".kkkkkkkk.", "kcccccccck", "kcCCCCCCck", "kkkkyykkkk", "kccckyyck.", "kcccyycck.", "kCCCCCCCCk", "kkkkkkkkkk"],
  note: ["kkkkkkk..", "kpppppkk.", "kpkkkpkpk", "kpppppppk", "kpkkkkkpk", "kpppppppk", "kpkkkkkpk", "kpppppppk", "kkkkkkkkk"],
  ladder: ["k.....k", "khhhhhk", "k.....k", "k.....k", "khhhhhk", "k.....k", "k.....k", "khhhhhk", "k.....k"],
  pick: [".kkkkkkkkk.", "kmllllllmmk", "kmk.khk.kmk", ".k..khk..k.", "....khk....", "....khk....", "....khk....", "....khk....", "....kkk...."],
  calendar: ["kkkkkkkkk", "krrrrrrrk", "kkkkkkkkk", "kpppppppk", "kpkpkpkpk", "kpppppppk", "kpkpkpkpk", "kpppppppk", "kkkkkkkkk"],
  clock: ["..kkkkk..", ".kpppppk.", "kpppkpppk", "kpppkpppk", "kpppkkkpk", "kpppppppk", "kpppppppk", ".kpppppk.", "..kkkkk.."],
};
const SP = {};
for (const [n, rows] of Object.entries(SPR)) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const cx = cv.getContext("2d");
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (PAL[ch]) { cx.fillStyle = PAL[ch]; cx.fillRect(x, y, 1, 1); } }));
  SP[n] = { src: cv.toDataURL(), w, h };
}
const img = (n, s = 2, alt = "") => `<img class="px" src="${SP[n].src}" width="${SP[n].w * s}" height="${SP[n].h * s}" alt="${alt}">`;
document.querySelectorAll("[data-icon]").forEach(el => el.innerHTML = img(el.dataset.icon, 4));

/* ---------- pixel textures for the mine zones ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TEX = {
  grass: [["#5aa53c", 4], ["#4a9332", 3], ["#6cb848", 2], ["#3d7f2a", 1]],
  earth: [["#7d5230", 5], ["#6e4628", 4], ["#8c5e37", 3], ["#5f3b21", 2], ["#a3896c", .35]],
  ice:   [["#4b8db5", 5], ["#5c9ec4", 4], ["#3b7aa3", 3], ["#77b6d8", 2], ["#cdeaf6", .35]],
  lava:  [["#6e1f13", 5], ["#842816", 4], ["#5a180e", 3], ["#a3311b", 2], ["#ff9a2b", .35], ["#ffd34a", .15]],
  cave:  [["#22170f", 6], ["#1d130c", 5], ["#281b12", 3], ["#30211a", .6]],
};
const texCache = {};
function texture(kind, w, h, seed) {
  const key = [kind, w, h, seed].join();
  if (texCache[key]) return texCache[key];
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const cx = cv.getContext("2d"), r = rng(seed), pal = TEX[kind], tot = pal.reduce((a, p) => a + p[1], 0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let v = r() * tot, i = 0; while (v > pal[i][1]) { v -= pal[i][1]; i++; }
    cx.fillStyle = pal[i][0]; cx.fillRect(x, y, 1, 1);
  }
  return texCache[key] = cv.toDataURL();
}
document.body.style.backgroundImage = `url(${texture("cave", 24, 24, 7)})`;
document.body.style.backgroundSize = "96px 96px";

/* ---------- render one language ---------- */
function render(lang) {
  const L_ = T[lang], li = lang === "zh" ? 1 : 2;
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = L_.doc;
  document.querySelectorAll(".lang a").forEach(a => a.setAttribute("aria-current", a.dataset.lang === lang ? "true" : "false"));
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = L_[el.dataset.t];
    el.innerHTML = Array.isArray(v) ? v.map(x => `<li>${x}</li>`).join("") : v;
  });
  const fmt = m => m.approx ? L_.approx
    : lang === "zh" ? m.t.slice(5, 10).replace("-", "/") + " " + m.t.slice(11, 16)
    : `Nov ${+m.t.slice(8, 10)} ${m.t.slice(11, 16)}`;

  document.getElementById("keys").innerHTML = Object.entries(KIND_ICON).map(([k, n]) => `<span>${img(n, 2)}${L_.kinds[k]}</span>`).join("");

  const zbox = document.getElementById("zones");
  zbox.innerHTML = "";
  ZK.forEach((z, zi) => {
    const [name, range, desc] = L_.zones[zi];
    let rows = "";
    for (const m of MS.filter(m => m.f >= z.lo && m.f <= z.hi)) {
      rows += `<article class="ms${m.goal ? " goal" : ""}">
        <div><div class="ebtn">${m.f}</div></div>
        <div style="min-width:0">
          <div class="meta"><span class="game">${m.g[li - 1]}</span>${m.d ? `<span class="pix">${m.d}</span>` : ""}
            <span class="pix">${L_.real} ${fmt(m)}</span><span class="chip ${m.w}">${L_.who[m.w]}</span><span>${m.wl[li - 1]}</span>
            ${m.goal ? `<span class="ribbon">${L_.goal}</span>` : ""}</div>
          <ul class="items">${m.items.map(it => `<li>${img(KIND_ICON[it[0]], 2, L_.kinds[it[0]])}<span>${it[li]}</span></li>`).join("")}</ul>
        </div></article>`;
    }
    const sec = document.createElement("section");
    sec.className = "zone " + z.k;
    sec.innerHTML = `<div class="zone-sign"><div class="plank">${name}<small>${range}</small></div><p>${desc}</p></div>
      <div class="strata" style="background-image:url(${texture(z.k, 160, 3, 11 + zi)})"></div>
      <div class="frame">${rows}</div>`;
    zbox.appendChild(sec);
  });

  /* chart: a cross-section of the shaft */
  const svg = document.getElementById("chart");
  svg.setAttribute("aria-label", L_.aria);
  const W = 960, H = 452, L = 56, R = 84, Tp = 40, B = 52, PX = 6;
  const t0 = Date.parse("2026-11-18T00:00"), t1 = Date.parse("2026-11-27T12:00");
  const X = t => L + (Date.parse(t) - t0) / (t1 - t0) * (W - L - R);
  const Y = f => Tp + f / 120 * (H - Tp - B);
  const IW = W - L - R;
  let s = "";
  const band = (kind, y0, y1, seed) => `<image href="${texture(kind, Math.ceil(IW / PX), Math.ceil((y1 - y0) / PX), seed)}" x="${L}" y="${y0}" width="${IW}" height="${y1 - y0}" preserveAspectRatio="none" style="image-rendering:pixelated"/>`;
  s += band("grass", Tp - 12, Tp, 3);
  s += band("earth", Y(0), Y(40), 4) + band("ice", Y(40), Y(80), 5) + band("lava", Y(80), Y(120), 6);
  s += `<rect x="${L}" y="${Tp}" width="${IW}" height="${Y(120) - Tp}" fill="#000" opacity=".22"/>`;
  s += `<rect x="${L}" y="${Tp - 12}" width="${IW}" height="${Y(120) - Tp + 12}" fill="none" stroke="#000" stroke-width="3"/>`;
  s += `<text x="${L + 6}" y="${Tp - 18}" font-size="13" fill="#bfe39a" font-family="var(--f-body)">${L_.entrance}</text>`;
  ZK.forEach((z, zi) => {
    const yc = (Y(z.lo) + Y(Math.min(z.hi + 1, 120))) / 2;
    s += `<rect x="${W - R + 10}" y="${yc - 22}" width="64" height="44" fill="var(--${z.k})" stroke="#000" stroke-width="3"/>`
      + `<text x="${W - R + 42}" y="${yc - 3}" text-anchor="middle" font-size="16" fill="#fff4d8" font-family="var(--f-display)">${L_.zones[zi][0]}</text>`
      + `<text x="${W - R + 42}" y="${yc + 15}" text-anchor="middle" font-size="12" fill="#fff4d8" font-family="var(--f-pix)">${z.lo === 0 ? 1 : z.lo}–${z.hi}</text>`;
  });
  for (let f = 0; f <= 120; f += 20) s += `<line x1="${L}" x2="${L + IW}" y1="${Y(f)}" y2="${Y(f)}" stroke="#fff" stroke-opacity=".16" stroke-dasharray="6 6"/>`
    + `<text x="${L - 10}" y="${Y(f) + 5}" text-anchor="end" font-size="14" fill="var(--cave-ink)" font-family="var(--f-pix)">${f}</text>`;
  s += `<text x="${L - 10}" y="${Tp - 18}" text-anchor="end" font-size="12" fill="var(--cave-dim)" font-family="var(--f-body)">${L_.floorAxis}</text>`;
  for (let d = 18; d <= 27; d++) {
    const x = X(`2026-11-${d}T00:00`);
    s += `<line x1="${x}" x2="${x}" y1="${Tp}" y2="${Y(120)}" stroke="#fff" stroke-opacity=".12" stroke-dasharray="3 6"/>`
      + `<text x="${x}" y="${H - B + 30}" text-anchor="middle" font-size="14" fill="var(--cave-ink)" font-family="var(--f-pix)">${lang === "zh" ? "11/" + d : "Nov " + d}</text>`;
  }
  let p = `M${X(MS[0].t)},${Y(MS[0].f)}`;
  for (let i = 1; i < MS.length; i++) p += ` H${X(MS[i].t)} V${Y(MS[i].f)}`;
  s += `<path d="${p}" fill="none" stroke="#1a0d05" stroke-width="7"/><path d="${p}" fill="none" stroke="#ffe9b0" stroke-width="2.5"/>`;
  const at = f => MS.find(m => m.f === f);
  const tw = txt => [...txt].reduce((a, ch) => a + (/[⺀-鿿＀-￯]/.test(ch) ? 13 : 7.3), 0);
  const note = (f, txt, dx, dy) => {
    const m = at(f), x = X(m.t), y = Y(m.f), w = tw(txt) + 18, bx = x + dx - w, by = y + dy - 13;
    return `<line x1="${x}" y1="${y}" x2="${x + dx}" y2="${y + dy}" stroke="#ffe9b0" stroke-width="2"/>`
      + `<rect x="${bx}" y="${by}" width="${w}" height="26" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>`
      + `<text x="${bx + w / 2}" y="${by + 18}" text-anchor="middle" font-size="13" fill="var(--ink)" font-family="var(--f-body)" font-weight="500">${txt}</text>`;
  };
  s += note(50, L_.n50, -20, 40) + note(75, L_.n75, -20, 40) + note(95, L_.n95, -20, 36) + note(120, L_.n120, -45, 8);
  const COL = {early: "var(--early)", hand: "var(--hand)", prog: "var(--prog)"};
  for (const m of MS) {
    const x = X(m.t), y = Y(m.f), r = m.goal ? 8 : 5.5;
    if (m.goal) s += `<rect class="glow" x="${x - 14}" y="${y - 14}" width="28" height="28" fill="var(--gold)" opacity=".6"/>`;
    s += `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}" fill="${m.goal ? "var(--gold)" : COL[m.w]}" stroke="#000" stroke-width="2.5"><title>${m.f} · ${m.g[li - 1]}${m.d ? " · " + m.d : ""} · ${L_.real} ${fmt(m)}</title></rect>`
      + `<text x="${x - r - 5}" y="${y + 5}" text-anchor="end" font-size="13" font-weight="600" fill="#fff4d8" stroke="#1a0d05" stroke-width="3" paint-order="stroke" font-family="var(--f-pix)">${m.f}</text>`;
  }
  svg.innerHTML = s;
}

function pick() {
  const h = location.hash.slice(1);
  if (h === "zh" || h === "en") return h;
  return /^zh/i.test(navigator.language || "zh") ? "zh" : "en";
}
render(pick());
addEventListener("hashchange", () => render(pick()));
</script>
</body></html>
